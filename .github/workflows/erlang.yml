name: Erlang CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        erlang: [27, 28, 29]

    container:
      image: erlang:${{ matrix.erlang }}

    steps:
    - uses: actions/checkout@v5
    - name: Compile
      run: make compile
    - name: Run xref
      run: make xref
    - name: Run eunit
      run: make eunit
    # OTP 27.3 supports {otp, select_read} but its socket specs predate
    # it, so dialyzer rejects valid code there
    - name: Run dialyzer
      if: ${{ matrix.erlang != 27 }}
      run: make dialyzer
